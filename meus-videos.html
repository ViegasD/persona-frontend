<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="storefront-config.js"></script>
<!-- Google sign-in paused pending app verification. Uncomment to re-enable.
<script src="google-auth.js" defer></script>
-->
<title>Meus Vídeos | Recado Animado</title>
<link rel="icon" type="image/png" href="img/Recado-animado-LOGO.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9fd;--bg2:#ffffff;--bg3:#ffffff;--border:#dce4ef;--text:#17335a;--text2:#4f6079;--text3:#5b6a80;--green:#187340;--green-dim:rgba(24,115,64,.1);--accent:#1f5fd1;--purple:#1f5fd1;--purple-dim:rgba(31,95,209,.1);--gold:#a87400;--red:#c62f28;--t:.25s cubic-bezier(.25,.1,.25,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Outfit',sans-serif;color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}

.header{position:sticky;top:0;z-index:100;padding:12px 20px;background:rgba(255,255,255,.94);backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header-back{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:500;color:var(--text2);transition:color var(--t);text-decoration:none}
.header-back:hover{color:var(--text)}
.header-back svg{width:18px;height:18px}
.header-title{font-size:.95rem;font-weight:600}

.container{max-width:640px;margin:0 auto;padding:32px 16px 80px}

.hero{text-align:center;margin-bottom:36px}
.hero-emoji{font-size:3rem;margin-bottom:12px}
.hero h1{font-size:2rem;font-weight:800;letter-spacing:0;margin-bottom:8px}
.hero p{color:var(--text2);font-size:.95rem;line-height:1.5}

.search-card{border-top:1px solid var(--border);padding:24px 0}
.account-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0}
.account-bar p{overflow-wrap:anywhere;color:var(--text2);font-size:.88rem}
.account-bar strong{color:var(--green)}
[hidden]{display:none!important}
.search-card label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.input-wrap{position:relative}
.input-wrap input{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-family:'Outfit',sans-serif;font-size:1rem;color:var(--text);outline:none;transition:border-color var(--t)}
.input-wrap input::placeholder{color:var(--text3)}
.input-wrap input:focus{border-color:var(--purple)}
.btn-search{width:100%;margin-top:14px;padding:15px;background:var(--purple);color:#fff;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity var(--t),transform var(--t)}
.btn-search:hover{opacity:.88;transform:translateY(-1px)}
.btn-search:active{transform:translateY(0)}
.btn-search:disabled{opacity:.5;cursor:not-allowed;transform:none}

.divider{display:flex;align-items:center;gap:10px;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:.75rem;color:var(--text3);font-weight:500}

.error-msg{background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.25);border-radius:12px;padding:14px 16px;color:var(--red);font-size:.88rem;margin-top:16px;display:none}
.error-msg.show{display:block}

.results{margin-top:28px;display:none}
.results.show{display:block}
.results-title{font-size:.8rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}

.empty-state{text-align:center;padding:40px 16px;color:var(--text3)}
.empty-state .emoji{font-size:2.5rem;margin-bottom:10px}
.empty-state p{font-size:.9rem;line-height:1.5}

.order-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px}
.order-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.order-meta{font-size:.8rem;color:var(--text2)}
.order-meta strong{color:var(--text);font-weight:600}
.order-badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:980px}
.order-badge.ready{background:var(--green-dim);color:var(--green)}
.order-badge.delivered{background:rgba(74,158,245,.1);color:var(--accent)}

.items-list{padding:12px 16px;display:flex;flex-direction:column;gap:12px}

.item-row{display:flex;align-items:flex-start;gap:12px}
.item-thumb{width:60px;height:106px;border-radius:10px;object-fit:cover;background:var(--bg2);flex-shrink:0}
.item-thumb-placeholder{width:60px;height:106px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.4rem}
.item-info{flex:1;min-width:0}
.item-name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-desc{font-size:.75rem;color:var(--text2);margin-top:1px}
.item-actions{display:flex;gap:6px;flex-shrink:0}

.btn-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all var(--t);text-decoration:none}
.btn-icon:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-dim)}
.btn-icon svg{width:16px;height:16px}
#logout{width:auto;padding:0 12px}
.library-loading{color:var(--text2);margin:24px 0;font-size:.9rem}

.video-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .25s ease;display:none}
.video-overlay.show{display:flex}
.video-overlay{border:0;max-width:none;max-height:none;width:100%;height:100%;margin:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.video-wrap{position:relative;width:100%;max-width:480px}
.video-wrap video{width:100%;border-radius:18px;display:block}
.video-close{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t)}
.video-close:hover{background:rgba(255,255,255,.3)}

.spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

body{font-family:'DM Sans',sans-serif!important}
h1,h2,h3,.header-title,.wizard-title,.btn,.pkg-name,.pkg-price,.qc-name{font-family:'Outfit',sans-serif}
:focus-visible{outline:3px solid #ff8a3d;outline-offset:2px}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="header-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    Início
  </a>
  <span class="header-title">Meus Vídeos</span>
  <span style="width:60px"></span>
</header>

<div class="container">
  <div class="hero">
    <div class="hero-emoji">🎬</div>
    <h1>Meus vídeos</h1>
    <p>Vídeos da sua conta Recado Animado.</p>
  </div>

  <div class="account-bar" id="account-bar" hidden>
    <p id="account-summary"></p>
    <a href="conta.html">Minha conta</a>
    <p id="account-verification-link" hidden>E-mail pendente. <a href="conta.html">Reenviar confirmação</a> para usar seu saldo de créditos.</p>
    <a href="checkout.html">Criar novo vídeo</a>
    <button type="button" class="btn-icon" id="logout" title="Sair da conta" aria-label="Sair da conta">Sair</button>
  </div>

  <form class="search-card" id="login-form">
    <label for="account-email">E-mail da conta</label>
    <div class="input-wrap"><input id="account-email" type="email" required autocomplete="username"></div>
    <label for="account-password" style="margin-top:14px">Senha</label>
    <div class="input-wrap"><input id="account-password" type="password" required autocomplete="current-password"></div>
    <button class="btn-search" id="login-button" type="submit">Entrar</button>
    <div class="google-auth" data-google-mode="login" hidden></div>
    <p style="margin-top:14px"><a href="conta.html#forgot">Esqueci minha senha</a></p>
    <p style="margin-top:14px"><a href="conta.html#signup">Criar conta</a> · <a href="conta.html">Minha conta e créditos</a></p>
  </form>
  <button class="btn-search" id="library-retry" type="button" hidden>Tentar carregar vídeos novamente</button>

  <p class="library-loading" id="library-loading" role="status" hidden>Carregando seus vídeos…</p>
  <div class="error-msg" id="error-msg" role="alert"></div>

  <div class="results" id="results">
    <div class="results-title" id="results-title"></div>
    <div id="results-list"></div>
  </div>
</div>

<!-- Video lightbox -->
<dialog class="video-overlay" id="video-overlay" aria-label="Assistir ao vídeo" onclick="fecharVideo(event)">
  <div class="video-wrap">
    <button class="video-close" onclick="fecharVideo()" aria-label="Fechar vídeo">✕</button>
    <video id="video-player" controls playsinline></video>
  </div>
</dialog>

<script>
const API_BASE = window.PersonaConfig.apiBaseUrl;

const STATUS_LABELS = {
  READY: { label: 'Pronto', cls: 'ready' },
  DELIVERED: { label: 'Entregue', cls: 'delivered' },
  DRAFT: { label: 'Rascunho', cls: 'delivered' },
  AWAITING_PAYMENT: { label: 'Aguardando pagamento', cls: 'delivered' },
  PAID: { label: 'Pago', cls: 'delivered' },
  QUEUED: { label: 'Na fila', cls: 'delivered' },
  GENERATING: { label: 'Em produção', cls: 'delivered' },
  FAILED: { label: 'Falhou', cls: 'delivered' },
  REFUNDED: { label: 'Reembolsado', cls: 'delivered' },
};

function authHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = localStorage.getItem('persona_access_token');
  if (token) headers.Authorization = 'Bearer ' + token;
  return headers;
}

async function accountRequest(path, options = {}) {
  const response = await fetch(API_BASE + path, { credentials: 'include', ...options, headers: authHeaders() });
  if (!response.ok) {
    const error = new Error(response.status === 401 ? 'E-mail ou senha inválidos. Entre novamente.' : 'Não foi possível carregar a conta.');
    error.status = response.status;
    throw error;
  }
  return response.json();
}

async function loadLibrary() {
  const session = window.PersonaSession.snapshot();
  const retry = document.getElementById('library-retry');
  const loading = document.getElementById('library-loading');
  retry.hidden = true;
  loading.hidden = false;
  document.getElementById('results').setAttribute('aria-busy', 'true');
  document.getElementById('error-msg').classList.remove('show');
  try {
    const user = await accountRequest('/auth/me');
    if (!window.PersonaSession.isCurrent(session)) return;
    document.getElementById('login-form').hidden = true;
    document.getElementById('account-bar').hidden = false;
    document.querySelector('.google-auth').dataset.googleDisabled = 'true';
    const summary = document.getElementById('account-summary');
    summary.textContent = `${user.email} · ${user.credit_balance} crédito${user.credit_balance === 1 ? '' : 's'}`;
    summary.textContent += user.email_verified ? ' · E-mail verificado' : ' · Verificação de e-mail pendente';
    document.getElementById('account-verification-link').hidden = !!user.email_verified;
    const orders = await accountRequest('/orders/mine');
    if (!window.PersonaSession.isCurrent(session)) return;
    renderizarResultados(orders);
  } catch (error) {
    if (!window.PersonaSession.isCurrent(session)) return;
    if (error.status === 401) signOut();
    else retry.hidden = false;
    mostrarErro(error.message);
  } finally {
    if (window.PersonaSession.isCurrent(session)) {
      loading.hidden = true;
      document.getElementById('results').setAttribute('aria-busy', 'false');
    }
  }
}

function signOut() {
  window.PersonaSession.clear();
  document.getElementById('account-bar').hidden = true;
  document.getElementById('login-form').hidden = false;
  document.getElementById('results').classList.remove('show');
  document.getElementById('results-list').replaceChildren();
  document.getElementById('account-summary').textContent = '';
  document.getElementById('library-loading').hidden = true;
  document.getElementById('results').setAttribute('aria-busy', 'false');
  fecharVideo();
  document.getElementById('library-retry').hidden = true;
  document.querySelector('.google-auth').dataset.googleDisabled = 'false';
  window.PersonaGoogle?.refresh();
}

document.getElementById('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('login-button');
  window.PersonaGoogle?.invalidate();
  const session = window.PersonaSession.snapshot();
  button.disabled = true;
  document.getElementById('error-msg').classList.remove('show');
  try {
    const token = await accountRequest('/auth/login', {
      method: 'POST', body: JSON.stringify({
        email: document.getElementById('account-email').value.trim(),
        password: document.getElementById('account-password').value,
      }),
    });
    if (!window.PersonaSession.isCurrent(session)) return;
    window.PersonaSession.setToken(token.access_token);
    document.getElementById('account-password').value = '';
    await loadLibrary();
  } catch (error) { mostrarErro(error.message); }
  finally {
    button.disabled = false;
    if (!window.PersonaSession.getToken()) window.PersonaGoogle?.refresh();
  }
});

window.addEventListener('persona-google-auth', () => {
  document.getElementById('account-password').value = '';
  loadLibrary().catch(error => mostrarErro(error.message));
});

document.getElementById('logout').addEventListener('click', signOut);
document.getElementById('library-retry').addEventListener('click', loadLibrary);

window.addEventListener('storage', event => {
  if (event.key !== 'persona_access_token' && event.key !== null) return;
  document.getElementById('results').classList.remove('show');
  document.getElementById('results-list').replaceChildren();
  document.getElementById('account-summary').textContent = '';
  fecharVideo();
  if (window.PersonaSession.getToken()) loadLibrary();
  else signOut();
});

if (localStorage.getItem('persona_access_token')) {
  loadLibrary();
}

function renderizarResultados(orders) {
  const resultsEl = document.getElementById('results');
  const titleEl = document.getElementById('results-title');
  const listEl = document.getElementById('results-list');

  // Flatten all items from all orders
  const allItems = orders.flatMap(o =>
    (o.items || []).map(item => ({ ...item, order: o }))
  );

  if (allItems.length === 0) {
    titleEl.textContent = 'Seus vídeos';
    listEl.innerHTML = `
      <div class="empty-state">
        <p>Você ainda não tem vídeos na sua conta.</p>
      </div>`;
    resultsEl.classList.add('show');
    return;
  }

  const plural = allItems.length === 1 ? '1 vídeo encontrado' : `${allItems.length} vídeos encontrados`;
  titleEl.textContent = plural;

  listEl.innerHTML = allItems.map(item => {
    const charName = item.character?.name || item.character_slug || item.character_ids?.join(', ') || 'Personagem';
    const childName = window.PersonaOrder.recipientName(item, item.order);
    const videoUrl = item.video_url;
    const badge = STATUS_LABELS[item.order.status] || { label: item.order.status, cls: 'ready' };

    const thumbHtml = item.thumbnail_url
      ? `<img class="item-thumb" src="${escHtml(item.thumbnail_url)}" alt="${escHtml(charName)}" onerror="this.style.display='none'">`
      : `<div class="item-thumb-placeholder">🎭</div>`;

    const playBtn = videoUrl ? `
      <a class="btn-icon" href="${escHtml(videoUrl)}" onclick="abrirVideo(event,this.href)" title="Assistir">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </a>` : '';

    const downloadBtn = videoUrl ? `
      <a class="btn-icon" href="${escHtml(videoUrl)}" download title="Baixar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>` : '';

    return `
      <div class="order-card">
        <div class="order-header">
          <span class="order-meta">Pedido <strong>#${item.order.id}</strong></span>
          <span class="order-badge ${badge.cls}">${escHtml(badge.label)}</span>
        </div>
        <div class="items-list">
          <div class="item-row">
            ${thumbHtml}
            <div class="item-info">
              <div class="item-name">${escHtml(charName)}</div>
              ${childName ? `<div class="item-desc">Para: ${escHtml(childName)}</div>` : ''}
            </div>
            <div class="item-actions">
              ${playBtn}
              ${downloadBtn}
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  resultsEl.classList.add('show');
}

function abrirVideo(e, url) {
  e.preventDefault();
  const player = document.getElementById('video-player');
  const overlay = document.getElementById('video-overlay');
  player.src = url;
  overlay.showModal();
  overlay.classList.add('show');
  player.play().catch(() => {});
}

function fecharVideo(e) {
  if (e && e.target !== document.getElementById('video-overlay') && !e.currentTarget.classList?.contains('video-close')) return;
  const player = document.getElementById('video-player');
  const overlay = document.getElementById('video-overlay');
  if (overlay.open) overlay.close();
  player.pause();
  player.src = '';
  overlay.classList.remove('show');
}

function mostrarErro(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('video-overlay').addEventListener('close', () => fecharVideo());

</script>
</body>
</html>
